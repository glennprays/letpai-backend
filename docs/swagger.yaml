        status:
          type: string
          enum: [active, completed, cancelled]
          example: "active"
        participant_count:
          type: integer
          example: 4
        paid_count:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
          example: "2026-03-18T10:00:00Z"

    CreateSessionRequest:
      type: object
      required:
        - session_name
      properties:
        session_name:
          type: string
          maxLength: 200
          example: "Liburan Bali"
        session_description:
          type: string
          nullable: true
        currency:
          type: string
          default: "IDR"
          example: "IDR"

    UpdateSessionRequest:
      type: object
      properties:
        session_name:
          type: string
          maxLength: 200
        session_description:
          type: string
          nullable: true
        session_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-20T10:00:00Z"

    SessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
